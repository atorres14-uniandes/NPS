<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¡Gracias por sus comentarios! - Atención a Egresados</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .thankyou-card {
      text-align: center;
      padding: 3.5rem 2rem;
    }

    .success-icon-wrapper {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.5rem;
      background: #f0fdf4;
      border: 2px solid #86efac;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #16a34a;
      box-shadow: 0 10px 25px -5px rgba(22, 163, 74, 0.3);
      animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .success-icon-wrapper svg {
      width: 44px;
      height: 44px;
      fill: currentColor;
    }

    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .thankyou-title {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 0.75rem;
    }

    .thankyou-desc {
      font-size: 1rem;
      color: var(--text-muted);
      max-width: 480px;
      margin: 0 auto 1.75rem;
      line-height: 1.6;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1.25rem;
      background: #eef2ff;
      border: 1px solid #c7d2fe;
      color: #4f46e5;
      font-size: 0.9rem;
      font-weight: 700;
      border-radius: var(--radius-full);
      margin-bottom: 2rem;
    }
  </style>
</head>
<body>

  <!-- Ambient Background Orbs -->
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>

  <main class="survey-wrapper">
    <div class="thankyou-card">
      <div class="success-icon-wrapper">
        <svg viewBox="0 0 24 24">
          <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
        </svg>
      </div>

      <h1 class="thankyou-title">¡Muchas gracias por su tiempo!</h1>
      <p class="thankyou-desc">
        Sus respuestas han sido registradas exitosamente en nuestro sistema de <strong>Atención a Egresados</strong>.
      </p>

      <div class="status-badge">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
        </svg>
        Estado del Caso: Actualizado a "Resuelto"
      </div>

      <div>
        <a href="index.html" class="btn btn-secondary">
          Volver al inicio
        </a>
      </div>
    </div>
  </main>

</body>
</html>
